<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>澄浅标签页</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; }

  /* 移动端：禁止橡皮筋 + 阻止原生长按菜单 */
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ============================================================
     浅色模式 —— 白色表面 + 更深的黑色多层阴影
     ============================================================ */
  :root {
    --surface: #e9e9e9;
    --text: #1a1a1a;
    --muted: #8c8c8c;
    --placeholder: #a9a9a9;
    --bg: linear-gradient(160deg, #ffffff 0%, #eeeeee 100%);

    --raise-1:
      0 1px 2px rgba(0, 0, 0, .14),
      0 3px 7px rgba(0, 0, 0, .13),
      0 10px 22px rgba(0, 0, 0, .14);

    --raise-2:
      0 1px 2px rgba(0, 0, 0, .13),
      0 4px 9px rgba(0, 0, 0, .12),
      0 14px 30px rgba(0, 0, 0, .16),
      0 28px 56px rgba(0, 0, 0, .10);

    --raise-2-focus:
      0 2px 4px rgba(0, 0, 0, .14),
      0 6px 14px rgba(0, 0, 0, .15),
      0 20px 40px rgba(0, 0, 0, .20),
      0 34px 68px rgba(0, 0, 0, .12);

    --press:
      inset 0 2px 5px rgba(0, 0, 0, .22),
      inset 0 5px 12px rgba(0, 0, 0, .13);

    --track:
      inset 0 2px 5px rgba(0, 0, 0, .22),
      inset 0 1px 2px rgba(0, 0, 0, .14),
      inset 0 0 0 1px rgba(0, 0, 0, .04);

    --focus-ring: rgba(80, 130, 255, .85);
  }

  /* ============================================================
     深色模式
     ============================================================ */
  body.dark {
    --surface: #1f1f1f;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --placeholder: #7a7a7a;
    --bg: linear-gradient(160deg, #595959 0%, #333333 100%);

    --raise-1:
      inset 0 1px 0 rgba(255, 255, 255, .22),
      inset 0 0 0 1px rgba(255, 255, 255, .10),
      inset 0 0 20px rgba(255, 255, 255, .10),
      0 2px 6px rgba(0, 0, 0, .75),
      0 10px 22px rgba(0, 0, 0, .55);

    --raise-2:
      inset 0 1px 0 rgba(255, 255, 255, .26),
      inset 0 0 0 1px rgba(255, 255, 255, .12),
      inset 0 0 30px rgba(255, 255, 255, .13),
      0 4px 10px rgba(0, 0, 0, .75),
      0 16px 34px rgba(0, 0, 0, .55);

    --raise-2-focus:
      inset 0 1px 0 rgba(255, 255, 255, .34),
      inset 0 0 0 1px rgba(255, 255, 255, .20),
      inset 0 0 40px rgba(255, 255, 255, .20),
      0 4px 10px rgba(0, 0, 0, .75),
      0 16px 34px rgba(0, 0, 0, .55);

    --press:
      inset 0 0 0 1px rgba(255, 255, 255, .22),
      inset 0 0 26px rgba(255, 255, 255, .32),
      inset 0 2px 6px rgba(0, 0, 0, .85);

    --track:
      inset 0 0 0 1px rgba(0, 0, 0, .85),
      inset 0 2px 7px rgba(0, 0, 0, .95),
      inset 0 1px 2px rgba(0, 0, 0, .80),
      0 1px 0 rgba(255, 255, 255, .07);

    --focus-ring: rgba(150, 190, 255, .85);
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 30vh;
    background: var(--bg);
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: color .35s ease;
    /* 移动端：禁止长按弹出系统菜单 / 点击高亮 */
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: rgba(128, 128, 128, .3); }

  /* ---------- 右上角控件组 ---------- */
  .top-controls {
    position: fixed;
    top: 22px;
    right: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }

  /* ---------- 语言切换滑块 ---------- */
  .lang-toggle {
    position: relative;
    width: 106px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--raise-1);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: opacity .3s ease, box-shadow .3s ease,
                background-color .35s ease, transform .15s ease;
  }
  .lang-toggle:active { transform: translateY(1px); }

  .lang-track {
    position: absolute;
    inset: 5px;
    display: flex;
    border-radius: 999px;
    box-shadow: var(--track);
  }

  .lang-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: calc(50% - 3px);
    height: calc(100% - 6px);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--raise-1);
    z-index: 1;
    transition: transform .34s cubic-bezier(.35, .9, .3, 1),
                background-color .35s ease, box-shadow .3s ease;
  }
  body.lang-en .lang-thumb { transform: translateX(100%); }

  body.dark .lang-thumb {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .30),
      inset 0 0 0 1.5px rgba(255, 255, 255, .18),
      inset 0 0 20px rgba(255, 255, 255, .22),
      0 2px 7px rgba(0, 0, 0, .95),
      0 6px 14px rgba(0, 0, 0, .55);
  }

  .lang-opt {
    position: relative;
    flex: 1;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--muted);
    z-index: 2;
    pointer-events: none;
    transition: color .25s ease;
  }
  body:not(.lang-en) .lang-opt[data-opt="zh"],
  body.lang-en .lang-opt[data-opt="en"] { color: var(--text); }

  /* ---------- 主题切换按钮 ---------- */
  .theme-toggle {
    position: relative;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--raise-1);
    transition: opacity .3s ease, box-shadow .3s ease,
                background-color .35s ease, color .35s ease,
                transform .15s ease;
  }
  .theme-toggle:active { transform: translateY(1px); }

  /* ============================================================
     右上角控件：默认 50% 不透明度，悬停 / 聚焦时 100%
     （仅在支持 hover 的设备上生效，触屏设备保持完全显示）
     ============================================================ */
  @media (hover: hover) {
    .lang-toggle,
    .theme-toggle { opacity: .5; }

    .lang-toggle:hover,
    .lang-toggle:focus-visible,
    .theme-toggle:hover,
    .theme-toggle:focus-visible { opacity: 1; }
  }

  .theme-toggle .icon {
    position: absolute;
    width: 21px;
    height: 21px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: opacity .3s ease, transform .45s cubic-bezier(.2, .8, .3, 1);
  }
  .icon-moon { opacity: 0; transform: rotate(-90deg) scale(.5); }
  body.dark .icon-sun  { opacity: 0; transform: rotate(90deg) scale(.5); }
  body.dark .icon-moon { opacity: 1; transform: none; }

  /* ---------- 主舞台 ---------- */
  .stage {
    width: min(600px, calc(100vw - 44px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  /* ---------- 搜索引擎按钮组 ---------- */
  .engines {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    min-height: 60px;
    width: 100%;
  }

  .engine {
    position: relative;
    width: 60px;
    height: 60px;
    padding: 0;
    border: 0;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background: var(--surface);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    box-shadow: none;
    opacity: .5;                   /* 未聚焦：整个按钮 50% */
    transition: background-color .35s ease, transform .15s ease,
                opacity .32s ease;
  }
  .engine:active { transform: translateY(1px); }

  /* 隐藏：从布局中移除，其余图标自动补位 */
  .engine.is-hidden { display: none; }

  /* 搜索框聚焦：整个按钮提升到 100% */
  .stage:focus-within .engine { opacity: 1; }

  .engine::before,
  .engine::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    transition: opacity .40s cubic-bezier(.4, 0, .2, 1),
                box-shadow .35s ease;
  }
  .engine::before { box-shadow: var(--raise-1); opacity: 1; }
  .engine::after  { box-shadow: var(--press);   opacity: 0; }

  .engine.active::before { opacity: 0; }
  .engine.active::after  { opacity: 1; }

  .engine img {
    position: relative;
    z-index: 1;
    display: block;
    width: 35px;
    height: 35px;
    border-radius: 7px;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* ---------- 搜索框 ---------- */
  .search {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 7px 7px 4px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--raise-2);
    opacity: .5;                   /* 未聚焦：50% */
    transition: box-shadow .3s ease, background-color .35s ease,
                opacity .32s ease;
  }
  .search:focus-within {
    box-shadow: var(--raise-2-focus);
    opacity: 1;                    /* 聚焦后：100% */
  }

  .search input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 15px 4px 15px 24px;
    border: 0;
    outline: 0;
    background: transparent;
    font: inherit;
    font-size: 16px;
    line-height: 1.4;
    color: var(--text);
    caret-color: currentColor;
    /* 输入框允许选择文本，保留系统长按选择菜单的能力 */
    -webkit-touch-callout: default;
    -webkit-user-select: text;
    user-select: text;
  }
  .search input::placeholder { color: var(--placeholder); }

  .submit {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    box-shadow: var(--raise-1);
    transition: box-shadow .28s ease, color .28s ease,
                background-color .35s ease, transform .15s ease;
  }
  .submit:hover { color: var(--text); }
  .submit:active {
    transform: translateY(1px);
    box-shadow: var(--press);
  }
  .submit svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .search input:focus-visible { outline: none; }

  /* ============================================================
     自定义右键菜单
     ============================================================ */
  .context-menu {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 120;
    min-width: 208px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--raise-2);
    visibility: hidden;
    opacity: 0;
    transform: scale(.94);
    transform-origin: top left;
    transition: opacity .18s ease,
                transform .22s cubic-bezier(.3, .9, .3, 1),
                visibility .22s,
                background-color .35s ease,
                box-shadow .35s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .context-menu.open {
    visibility: visible;
    opacity: 1;
    transform: scale(1);
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: background-color .2s ease, box-shadow .25s ease,
                color .3s ease, opacity .25s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .menu-item:hover { background: rgba(128, 128, 128, .15); }
  .menu-item:active { box-shadow: var(--press); }
  .menu-item:disabled { opacity: .38; cursor: default; }
  .menu-item:disabled:hover { background: transparent; }
  .menu-item:disabled:active { box-shadow: none; }

  .menu-item svg {
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .82;
  }

  /* ---------- 轻提示 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    z-index: 200;
    max-width: calc(100vw - 40px);
    padding: 11px 20px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    box-shadow: var(--raise-2);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 14px);
    transition: opacity .28s ease,
                transform .35s cubic-bezier(.3, .9, .3, 1),
                background-color .35s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ---------- 小屏适配 ---------- */
  @media (max-width: 520px) {
    .top-controls { top: 14px; right: 14px; gap: 10px; }
    .lang-toggle { width: 92px; height: 40px; }
    .lang-opt { font-size: 11px; }
    .theme-toggle { width: 42px; height: 42px; }
    .theme-toggle .icon { width: 19px; height: 19px; }
    .stage { width: calc(100vw - 32px); gap: 22px; }
    .engines { gap: 10px; min-height: 42px; }
    .engine { width: 42px; height: 42px; border-radius: 13px; }
    .engine img { width: 22px; height: 22px; border-radius: 6px; }
    .search input { padding-left: 20px; font-size: 15px; }
    .submit { width: 42px; height: 42px; }
    .context-menu { min-width: 180px; }
    .menu-item { font-size: 13px; padding: 9px 10px; }
  }
</style>
</head>
<body>

  <!-- 右上角：语言滑块 + 主题切换 -->
  <div class="top-controls">
    <button class="lang-toggle" id="langToggle" type="button"
            tabindex="-1" aria-label="切换语言 / Switch language">
      <span class="lang-track">
        <span class="lang-thumb" aria-hidden="true"></span>
        <span class="lang-opt" data-opt="zh">中文</span>
        <span class="lang-opt" data-opt="en">EN</span>
      </span>
    </button>

    <button class="theme-toggle" id="themeToggle" type="button"
            tabindex="-1" aria-label="切换到深色模式">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" />
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.6 8.6 0 1 0 11 11z" />
      </svg>
    </button>
  </div>

  <main class="stage">
    <!-- 搜索引擎切换 -->
    <div class="engines" id="engines" role="group" aria-label="搜索引擎"></div>

    <!-- 搜索框 -->
    <form class="search" id="searchForm" role="search">
      <input id="q" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false"
             aria-label="搜索" placeholder="搜索" />
      <button class="submit" type="submit" tabindex="-1" aria-label="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4.5 4.5" />
        </svg>
      </button>
    </form>
  </main>

  <!-- 页面右键菜单 -->
  <div class="context-menu" id="contextMenu" role="menu" aria-label="页面菜单">
    <button class="menu-item" id="menuUpload" type="button" role="menuitem" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="3.2" />
        <circle cx="8.6" cy="10" r="1.6" />
        <path d="M3.6 17.4l4.6-4.6 3.4 3.4 3.2-3.2 5.6 5.6" />
      </svg>
      <span id="menuUploadText">上传背景图片</span>
    </button>
    <button class="menu-item" id="menuReset" type="button" role="menuitem" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.8 12a8.2 8.2 0 1 0 2.5-6" />
        <path d="M3.4 4.2v5.4h5.4" />
      </svg>
      <span id="menuResetText">恢复默认背景</span>
    </button>
  </div>

  <!-- 输入框编辑菜单 -->
  <div class="context-menu" id="inputMenu" role="menu" aria-label="编辑菜单">
    <button class="menu-item" id="menuCut" type="button" role="menuitem" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="6.2" cy="6.2" r="2.7" />
        <circle cx="6.2" cy="17.8" r="2.7" />
        <path d="M8.4 7.9L19.6 17.6M8.4 16.1L19.6 6.4" />
      </svg>
      <span id="menuCutText">剪切</span>
    </button>
    <button class="menu-item" id="menuCopy" type="button" role="menuitem" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8.8" y="8.8" width="11.4" height="11.4" rx="2.6" />
        <path d="M15.2 5.4v-.6a1.8 1.8 0 0 0-1.8-1.8H4.8A1.8 1.8 0 0 0 3 4.8v8.6a1.8 1.8 0 0 0 1.8 1.8h.6" />
      </svg>
      <span id="menuCopyText">复制</span>
    </button>
    <button class="menu-item" id="menuPaste" type="button" role="menuitem" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="2.8" width="8" height="3.8" rx="1.4" />
        <path d="M8 4.6H6.4A1.6 1.6 0 0 0 4.8 6.2v13A1.6 1.6 0 0 0 6.4 20.8h11.2a1.6 1.6 0 0 0 1.6-1.6v-13a1.6 1.6 0 0 0-1.6-1.6H16" />
      </svg>
      <span id="menuPasteText">粘贴</span>
    </button>
  </div>

  <!-- 搜索引擎按钮菜单 -->
  <div class="context-menu" id="engineMenu" role="menu" aria-label="搜索引擎菜单">
    <button class="menu-item" id="menuHide" type="button" role="menuitem" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.6 12S6 5.4 12 5.4 21.4 12 21.4 12 18 18.6 12 18.6 2.6 12 2.6 12z" />
        <circle cx="12" cy="12" r="3.1" />
        <path d="M4 20L20 4" />
      </svg>
      <span id="menuHideText">隐藏</span>
    </button>
    <button class="menu-item" id="menuShow" type="button" role="menuitem" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.6 12S6 5.4 12 5.4 21.4 12 21.4 12 18 18.6 12 18.6 2.6 12 2.6 12z" />
        <circle cx="12" cy="12" r="3.1" />
      </svg>
      <span id="menuShowText">显示</span>
    </button>
  </div>

  <!-- 隐藏的文件选择框 -->
  <input type="file" id="bgFile" accept="image/*" hidden />

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =====================================================
     1. 基础数据
     ===================================================== */
  var ENGINES = [
    {
      id: 'google',

  function systemLang() {
    return String(navigator.language || navigator.userLanguage || 'en')
      .toLowerCase();
  }

  function detectDefaultMode() {
    return systemLang().indexOf('zh') === 0 ? 'zh' : 'en';
  }

  function resolveLocale(mode) {
    if (mode !== 'zh') return 'en';
    var l = systemLang();
    return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
  }

  function currentTexts() {
    return I18N[resolveLocale(langMode)];
  }

  /* =====================================================
     3. 状态初始化
     ===================================================== */
  var theme = 'light';
  try {
    if (localStorage.getItem(LS_THEME) === 'dark') theme = 'dark';
  } catch (e) {}

  var langMode = null;
  try { langMode = localStorage.getItem(LS_LANG); } catch (e) {}
  if (langMode !== 'zh' && langMode !== 'en') {
    langMode = detectDefaultMode();
    try { localStorage.setItem(LS_LANG, langMode); } catch (e) {}
  }

  var savedEngine = null;
  try { savedEngine = localStorage.getItem(LS_ENGINE); } catch (e) {}
  var current = (savedEngine && ENGINES.some(function (e) {
    return e.id === savedEngine;
  })) ? savedEngine : 'google';

  /* =====================================================
     4. 文案刷新
     ===================================================== */
  function updateTexts() {
    var loc = resolveLocale(langMode);
    var t   = I18N[loc];

    document.documentElement.lang = loc;
    document.title = t.title;
    body.classList.toggle('lang-en', langMode === 'en');

    input.placeholder = t.searchWith(engineById(current).name);
    input.setAttribute('aria-label', t.search);
    submitBtn.setAttribute('aria-label', t.search);
    enginesEl.setAttribute('aria-label', t.engines);
    langBtn.setAttribute('aria-label', t.langAria);
    themeBtn.setAttribute('aria-label',
      theme === 'dark' ? t.toLight : t.toDark);

    menuUploadText.textContent = t.menuUpload;
    menuResetText.textContent  = t.menuReset;
    menuUpload.setAttribute('aria-label', t.menuUpload);
    menuReset.setAttribute('aria-label', t.menuReset);
    ctxMenu.setAttribute('aria-label', t.pageMenu);

    menuCutText.textContent   = t.cut;
    menuCopyText.textContent  = t.copy;
    menuPasteText.textContent = t.paste;
    menuCut.setAttribute('aria-label', t.cut);
    menuCopy.setAttribute('aria-label', t.copy);
    menuPaste.setAttribute('aria-label', t.paste);
    inputMenu.setAttribute('aria-label', t.editMenu);

    menuHideText.textContent = t.hide;
    menuShowText.textContent = t.show;
    menuHide.setAttribute('aria-label', t.hide);
    menuShow.setAttribute('aria-label', t.show);
    engineMenu.setAttribute('aria-label', t.engineMenu);

    for (var i = 0; i < buttons.length; i++) {
      var engine = engineById(buttons[i].dataset.id);
      buttons[i].title = engine.name;
      buttons[i].setAttribute('aria-label', t.searchWith(engine.name));
    }
  }

    theme = mode;

    updateTexts();
  }
  applyTheme(theme);

  themeBtn.addEventListener('click', function () {
    applyTheme(theme === 'dark' ? 'light' : 'dark');
    this.blur();

    applyLang(langMode === 'zh' ? 'en' : 'zh');

  /* =====================================================
     7. 搜索引擎
     ===================================================== */
  function engineById(id) {
    for (var i = 0; i < ENGINES.length; i++) {
      if (ENGINES[i].id === id) return ENGINES[i];
    }
    return ENGINES[0];
  }

  function btnById(id) {
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].dataset.id === id) return buttons[i];
    }
    return null;
  }

  buttons = ENGINES.map(function (engine) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'engine';
    btn.dataset.id = engine.id;
    btn.tabIndex = -1;
    btn.setAttribute('aria-pressed', 'false');
    btn.title = engine.name;

    var img = document.createElement('img');
    img.src = engine.icon;
    img.alt = '';
    img.draggable = false;
    img.setAttribute('aria-hidden', 'true');
    btn.appendChild(img);

    // 阻止 mousedown 夺走输入框焦点，避免透明度闪动
    btn.addEventListener('mousedown', function (e) {
      e.preventDefault();
    });

    btn.addEventListener('click', function () {
      setEngine(engine.id);
      input.focus();
    });
    enginesEl.appendChild(btn);
    return btn;
  });

  function setEngine(id) {
    current = id;
    try { localStorage.setItem(LS_ENGINE, id); } catch (e) {}

    buttons.forEach(function (btn) {
      var on = btn.dataset.id === id;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    updateTexts();
  }
  setEngine(current);

  function rotateEngine(step) {
    var idx = 0;
    for (var i = 0; i < ENGINES.length; i++) {
      if (ENGINES[i].id === current) { idx = i; break; }
    }
    var next = ENGINES[(idx + step + ENGINES.length) % ENGINES.length];
    setEngine(next.id);
  }

  /* =====================================================
     8. 引擎按钮隐藏 / 显示
     ===================================================== */
  var hiddenEngines = {};
  var contextEngineId = null;

  (function loadHidden() {
    var raw = null;
    try { raw = localStorage.getItem(LS_HIDDEN); } catch (e) {}
    if (!raw) return;
    try {
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return;
      arr.forEach(function (id) {
        if (ENGINES.some(function (en) { return en.id === id; })) {
          hiddenEngines[id] = true;
        }
      });
    } catch (e) {}
  })();

  function saveHidden() {
    try {
      localStorage.setItem(LS_HIDDEN, JSON.stringify(Object.keys(hiddenEngines)));
    } catch (e) {}
  }

  function visibleEngineCount() {
    var n = 0;
    for (var i = 0; i < ENGINES.length; i++) {
      if (!hiddenEngines[ENGINES[i].id]) n++;
    }
    return n;
  }

  function hiddenEngineCount() {
    return ENGINES.length - visibleEngineCount();
  }

  function applyHiddenState() {
    for (var i = 0; i < ENGINES.length; i++) {
      var btn = btnById(ENGINES[i].id);
      if (btn) btn.classList.toggle('is-hidden', !!hiddenEngines[ENGINES[i].id]);
    }
  }

  function updateEngineMenuState() {
    menuHide.disabled = !contextEngineId;
    menuShow.disabled = hiddenEngineCount() === 0;
  }

  applyHiddenState();

  menuHide.addEventListener('click', function () {
    closeMenus();
    if (!contextEngineId) return;
    hiddenEngines[contextEngineId] = true;
    applyHiddenState();
    saveHidden();
  });

  menuShow.addEventListener('click', function () {
    closeMenus();
    hiddenEngines = {};
    applyHiddenState();
    saveHidden();
  });

  /* =====================================================
     9. 键盘交互
     ===================================================== */
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      rotateEngine(e.shiftKey ? -1 : 1);
      return;
    }
    if (e.key === 'Escape') input.value = '';
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    if (document.activeElement === input) return;
    e.preventDefault();
    rotateEngine(e.shiftKey ? -1 : 1);
    input.focus();
  });

  /* =====================================================
     10. 提交搜索
     ===================================================== */
  function currentSearchUrl() {
    var q = input.value.trim();
    if (!q) return null;
    return engineById(current).url + encodeURIComponent(q);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var url = currentSearchUrl();
    if (!url) { input.focus(); return; }
    window.location.href = url;
  });

  function openInNewTab(e) {
    if (e.button !== 1) return;
    e.preventDefault();
    e.stopPropagation();
    var url = currentSearchUrl();
    if (!url) { input.focus(); return; }
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  submitBtn.addEventListener('auxclick', openInNewTab);
  input.addEventListener('auxclick', openInNewTab);

  submitBtn.addEventListener('mousedown', function (e) {
    if (e.button === 1) e.preventDefault();
  });

  /* =====================================================
     12. IndexedDB 极简封装
     ===================================================== */
  var DB_NAME  = 'paleasy-tab';
  var DB_VER   = 1;
  var DB_STORE = 'assets';
  var DB_KEY   = 'custom-background';

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      if (!('indexedDB' in window)) {
        reject(new Error('indexeddb-unavailable'));
        return;
      }
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE);
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror   = function () { reject(req.error); };
    });
  }

  function idbSet(key, value) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(value, key);
        tx.oncomplete = function () { db.close(); resolve(); };
        tx.onerror    = function () { db.close(); reject(tx.error); };
        tx.onabort    = function () { db.close(); reject(tx.error); };
      });
    });
  }

  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readonly');
        var rq = tx.objectStore(DB_STORE).get(key);
        rq.onsuccess = function () { resolve(rq.result); };
        rq.onerror   = function () { reject(rq.error); };
        tx.oncomplete = function () { db.close(); };
      });
    });
  }

  function idbDel(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = function () { db.close(); resolve(); };
        tx.onerror    = function () { db.close(); reject(tx.error); };
      });
    });
  }

  /* =====================================================
     13. 自定义背景
     ===================================================== */
  var MAX_FILE_SIZE = 50 * 1024 * 1024;
  var MAX_EDGE      = 1920;
  var JPEG_QUALITY  = 0.86;

  var hasCustomBg = false;

  function applyBackground(dataURL) {
    hasCustomBg = true;
    body.classList.add('has-custom-bg');
    body.style.backgroundImage    = 'url("' + dataURL + '")';
    body.style.backgroundSize     = 'cover';
    body.style.backgroundPosition = 'center center';
    body.style.backgroundRepeat   = 'no-repeat';
    body.style.backgroundAttachment = 'fixed';
    updateMenuState();
  }

  function clearBackground() {
    hasCustomBg = false;
    body.classList.remove('has-custom-bg');
    body.style.backgroundImage    = '';
    body.style.backgroundSize     = '';
    body.style.backgroundPosition = '';
    body.style.backgroundRepeat   = '';
    body.style.backgroundAttachment = '';
    updateMenuState();
  }

  function updateMenuState() {
    menuReset.disabled = !hasCustomBg;
  }

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();

      img.onload = function () {
        URL.revokeObjectURL(url);
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) { reject(new Error('bad-image')); return; }

          var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
          var tw = Math.max(1, Math.round(w * scale));
          var th = Math.max(1, Math.round(h * scale));

          var canvas = document.createElement('canvas');
          canvas.width  = tw;
          canvas.height = th;

          var ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          if ('imageSmoothingQuality' in ctx) {
            ctx.imageSmoothingQuality = 'high';
          }
          ctx.drawImage(img, 0, 0, tw, th);

          var type = /^image\/(png|webp)$/.test(file.type) ? file.type : 'image/jpeg';
          resolve(canvas.toDataURL(type, JPEG_QUALITY));
        } catch (err) {
          reject(err);
        }
      };

      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('decode-failed'));
      };

      img.src = url;
    });
  }

  function restoreBackground() {
    idbGet(DB_KEY).then(function (dataURL) {
      if (typeof dataURL === 'string' && dataURL) applyBackground(dataURL);
      else updateMenuState();
    }).catch(function () {
      updateMenuState();
    });
  }
  restoreBackground();

  menuUpload.addEventListener('click', function () {
    closeMenus();
    fileInput.click();
  });

  fileInput.addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;

    var t = currentTexts();

    if (!/^image\//.test(file.type)) {
      showToast(t.bgNotImage);
      return;
    }
    if (file.size > MAX_FILE_SIZE) {
      showToast(t.bgTooLarge);
      return;
    }

    compressImage(file).then(function (dataURL) {
      return idbSet(DB_KEY, dataURL).then(function () {
        applyBackground(dataURL);
      });
    }).catch(function () {
      showToast(currentTexts().bgFailed);
    });
  });

  menuReset.addEventListener('click', function () {
    closeMenus();
    if (!hasCustomBg) return;
    clearBackground();
    idbDel(DB_KEY).catch(function () {});
  });

  /* =====================================================
     14. 自定义右键菜单
     ===================================================== */
  var activeMenu = null;
  var lastOpenTime = 0;

  // 输入框选区快照
  var savedSel = { start: 0, end: 0 };

  function openMenu(menuEl, x, y) {
    // 去抖：长按与 contextmenu 可能几乎同时触发，避免重复打开
    var now = Date.now();
    if (menuEl === activeMenu && now - lastOpenTime < 400) return;
    lastOpenTime = now;

    if (activeMenu && activeMenu !== menuEl) {
      activeMenu.classList.remove('open');
    }
    activeMenu = menuEl;
    menuEl.classList.add('open');

    var pad = 10;
    var w = menuEl.offsetWidth;
    var h = menuEl.offsetHeight;

    var left = Math.min(Math.max(pad, x),
                        Math.max(pad, window.innerWidth - w - pad));
    var top  = Math.min(Math.max(pad, y),
                        Math.max(pad, window.innerHeight - h - pad));

    menuEl.style.left = left + 'px';
    menuEl.style.top  = top  + 'px';
  }

  function closeMenus() {
    if (!activeMenu) return;
    activeMenu.classList.remove('open');
    activeMenu = null;
  }

  /* ---------- 编辑菜单状态 ---------- */
  function updateInputMenuState() {
    var hasSel = savedSel.end > savedSel.start;
    menuCut.disabled  = !hasSel;
    menuCopy.disabled = !hasSel;
    menuPaste.disabled = false;
  }

  function restoreCaret() {
    input.focus({ preventScroll: true });
    try { input.setSelectionRange(savedSel.start, savedSel.end); } catch (err) {}
  }

  /* ---------- 复制 / 剪切 ---------- */
  function doCopy(cut) {
    if (savedSel.end <= savedSel.start) return;
    restoreCaret();

    var ok = false;
    try { ok = document.execCommand(cut ? 'cut' : 'copy'); } catch (err) { ok = false; }

    if (!ok) {
      var text = input.value.slice(savedSel.start, savedSel.end);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () {});
      }
      if (cut) input.setRangeText('', savedSel.start, savedSel.end, 'end');
    }

    if (cut) {
      savedSel.start = savedSel.end = input.selectionStart || 0;
    }
  }

  /* ---------- 插入文本 ---------- */
  function insertText(text) {
    input.focus({ preventScroll: true });
    try { input.setSelectionRange(savedSel.start, savedSel.end); } catch (err) {}

    var ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (err) { ok = false; }

    if (!ok) input.setRangeText(text, savedSel.start, savedSel.end, 'end');

    savedSel.start = savedSel.end = input.selectionStart || 0;
  }

  /* ---------- 降级粘贴 ---------- */
  function legacyPaste() {
    restoreCaret();
    try { document.execCommand('paste'); } catch (err) {}
    savedSel.start = savedSel.end = input.selectionStart || 0;
  }

  /* ---------- 粘贴 ---------- */
  function doPaste() {
    restoreCaret();
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        if (text) insertText(text);
      }).catch(function () {
        legacyPaste();
      });
    } else {
      legacyPaste();
    }
  }

  menuCut.addEventListener('click', function () { closeMenus(); doCopy(true); });
  menuCopy.addEventListener('click', function () { closeMenus(); doCopy(false); });
  menuPaste.addEventListener('click', function () { closeMenus(); doPaste(); });

  /* ---------- 统一菜单分发逻辑 ---------- */
  function showContextMenuAt(x, y, target) {
    if (target && target.nodeType !== 1) target = target.parentElement;

    // 顶部控件 / 搜索按钮：无菜单
    if (target && target.closest && target.closest('.top-controls, .submit')) {
      closeMenus();
      return;
    }

    // 已有菜单内部：忽略
    if (target && target.closest && target.closest('.context-menu')) {
      return;
    }

    // 搜索引擎按钮：隐藏 / 显示
    var engineBtn = target && target.closest ? target.closest('.engine') : null;
    if (engineBtn) {
      contextEngineId = engineBtn.dataset.id;
      updateEngineMenuState();
      openMenu(engineMenu, x, y);
      return;
    }

    // 引擎容器空白区（含全部隐藏时）
    var engineArea = target && target.closest ? target.closest('.engines') : null;
    if (engineArea) {
      contextEngineId = null;
      updateEngineMenuState();
      openMenu(engineMenu, x, y);
      return;
    }

    // 搜索输入框：剪切 / 复制 / 粘贴
    if (target === input) {
      savedSel.start = input.selectionStart || 0;
      savedSel.end   = input.selectionEnd   || 0;
      updateInputMenuState();
      openMenu(inputMenu, x, y);
      return;
    }

    // 其余区域：页面菜单
    updateMenuState();
    openMenu(ctxMenu, x, y);
  }

  /* ---------- 桌面端右键 ---------- */
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    showContextMenuAt(e.clientX, e.clientY, e.target);
  });

  /* ---------- 移动端长按 ---------- */
  var LONG_PRESS_MS = 500;
  var LONG_PRESS_TOLERANCE = 12;   // 允许手指微动
  var touchInfo = null;

  function cancelLongPress() {
    if (!touchInfo) return;
    clearTimeout(touchInfo.timer);
    touchInfo = null;
  }

  var isTouchDevice = ('ontouchstart' in window) ||
                      (navigator.maxTouchPoints > 0);

  if (isTouchDevice) {
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { cancelLongPress(); return; }
      var t = e.touches[0];
      touchInfo = {
        x: t.clientX,
        y: t.clientY,
        target: e.target,
        fired: false,
        timer: setTimeout(function () {
          if (!touchInfo) return;
          touchInfo.fired = true;
          showContextMenuAt(touchInfo.x, touchInfo.y, touchInfo.target);
        }, LONG_PRESS_MS)
      };
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (!touchInfo) return;
      var t = e.touches[0];
      var dx = t.clientX - touchInfo.x;
      var dy = t.clientY - touchInfo.y;
      if (dx * dx + dy * dy >
          LONG_PRESS_TOLERANCE * LONG_PRESS_TOLERANCE) {
        cancelLongPress();
      }
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
      if (!touchInfo) return;
      var fired = touchInfo.fired;
      cancelLongPress();
      if (fired) {
        // 长按已触发菜单：阻止后续合成 click
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchcancel', cancelLongPress);

    // 移动端：长按菜单项本身不再触发系统选择 / 放大镜
    document.addEventListener('touchstart', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('.context-menu')) {
        if (e.touches.length === 1) {
          // 允许菜单项自身的点击，但不启动长按计时
          cancelLongPress();
        }
      }
    }, { passive: true });
  }

  /* ---------- 关闭时机 ---------- */
  document.addEventListener('pointerdown', function (e) {
    if (!activeMenu) return;
    if (activeMenu.contains(e.target)) return;
    closeMenus();
  }, true);

  window.addEventListener('blur', closeMenus);
  window.addEventListener('resize', closeMenus);
  document.addEventListener('scroll', closeMenus, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenus();
  });

  updateMenuState();

  /* =====================================================
     15. 自动聚焦
     ===================================================== */
  window.addEventListener('load', function () {
    input.focus({ preventScroll: true });
  });
})();
</script>
</body>
</html>
