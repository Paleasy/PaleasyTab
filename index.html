<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>澄浅标签页</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
  /* 全局盒模型 */
  *, *::before, *::after { box-sizing: border-box; }

  /* 移动端禁止滚动溢出 */
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* 浅色模式变量 */
  :root {
    --surface: #e9e9e9;
    --text: #1a1a1a;
    --muted: #8c8c8c;
    --placeholder: #a9a9a9;
    --bg: linear-gradient(160deg, #ffffff 0%, #eeeeee 100%);
    --switch-on: #34c759;

    --raise-1:
      0 1px 2px rgba(0, 0, 0, .14),
      0 3px 7px rgba(0, 0, 0, .13),
      0 10px 22px rgba(0, 0, 0, .14);

    --raise-2:
      0 1px 2px rgba(0, 0, 0, .13),
      0 4px 9px rgba(0, 0, 0, .12),
      0 14px 30px rgba(0, 0, 0, .16),
      0 28px 56px rgba(0, 0, 0, .10);

    --raise-2-focus:
      0 2px 4px rgba(0, 0, 0, .14),
      0 6px 14px rgba(0, 0, 0, .15),
      0 20px 40px rgba(0, 0, 0, .20),
      0 34px 68px rgba(0, 0, 0, .12);

    --press:
      inset 0 2px 5px rgba(0, 0, 0, .22),
      inset 0 5px 12px rgba(0, 0, 0, .13);

    --track:
      inset 0 2px 5px rgba(0, 0, 0, .22),
      inset 0 1px 2px rgba(0, 0, 0, .14),
      inset 0 0 0 1px rgba(0, 0, 0, .04);
  }

  /* 深色模式变量 */
  body.dark {
    --surface: #1f1f1f;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --placeholder: #7a7a7a;
    --bg: linear-gradient(160deg, #595959 0%, #333333 100%);
    --switch-on: #30d158;

    --raise-1:
      inset 0 1px 0 rgba(255, 255, 255, .22),
      inset 0 0 0 1px rgba(255, 255, 255, .10),
      inset 0 0 20px rgba(255, 255, 255, .10),
      0 2px 6px rgba(0, 0, 0, .75),
      0 10px 22px rgba(0, 0, 0, .55);

    --raise-2:
      inset 0 1px 0 rgba(255, 255, 255, .26),
      inset 0 0 0 1px rgba(255, 255, 255, .12),
      inset 0 0 30px rgba(255, 255, 255, .13),
      0 4px 10px rgba(0, 0, 0, .75),
      0 16px 34px rgba(0, 0, 0, .55);

    --raise-2-focus:
      inset 0 1px 0 rgba(255, 255, 255, .34),
      inset 0 0 0 1px rgba(255, 255, 255, .20),
      inset 0 0 40px rgba(255, 255, 255, .20),
      0 4px 10px rgba(0, 0, 0, .75),
      0 16px 34px rgba(0, 0, 0, .55);

    --press:
      inset 0 0 0 1px rgba(255, 255, 255, .22),
      inset 0 0 26px rgba(255, 255, 255, .32),
      inset 0 2px 6px rgba(0, 0, 0, .85);

    --track:
      inset 0 0 0 1px rgba(0, 0, 0, .85),
      inset 0 2px 7px rgba(0, 0, 0, .95),
      inset 0 1px 2px rgba(0, 0, 0, .80),
      0 1px 0 rgba(255, 255, 255, .07);
  }

  /* 页面主体 */
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 30vh;
    background: var(--bg);
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: color .35s ease;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 文本选中色 */
  ::selection { background: rgba(128, 128, 128, .3); }

  /* 右上角控件组 */
  .top-controls {
    position: fixed;
    top: 22px;
    right: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }

  /* 语言切换滑块 */
  .lang-toggle {
    position: relative;
    width: 106px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--raise-1);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: opacity .3s ease, box-shadow .3s ease,
                background-color .35s ease, transform .15s ease;
  }
  .lang-toggle:active { transform: translateY(1px); }

  /* 语言滑块内槽 */
  .lang-track {
    position: absolute;
    inset: 5px;
    display: flex;
    border-radius: 999px;
    box-shadow: var(--track);
  }

  /* 语言滑块滑块头 */
  .lang-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: calc(50% - 3px);
    height: calc(100% - 6px);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--raise-1);
    z-index: 1;
    transition: transform .34s cubic-bezier(.35, .9, .3, 1),
                background-color .35s ease, box-shadow .3s ease;
  }
  body.lang-en .lang-thumb { transform: translateX(100%); }

  /* 深色下滑块头 */
  body.dark .lang-thumb {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .30),
      inset 0 0 0 1.5px rgba(255, 255, 255, .18),
      inset 0 0 20px rgba(255, 255, 255, .22),
      0 2px 7px rgba(0, 0, 0, .95),
      0 6px 14px rgba(0, 0, 0, .55);
  }

  /* 语言选项文本 */
  .lang-opt {
    position: relative;
    flex: 1;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--muted);
    z-index: 2;
    pointer-events: none;
    transition: color .25s ease;
  }
  body:not(.lang-en) .lang-opt[data-opt="zh"],
  body.lang-en .lang-opt[data-opt="en"] { color: var(--text); }

  /* 圆形图标按钮 */
  .theme-toggle,
  .settings-toggle {
    position: relative;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--raise-1);
    transition: opacity .3s ease, box-shadow .3s ease,
                background-color .35s ease, color .35s ease,
                transform .15s ease;
  }
  .theme-toggle:active,
  .settings-toggle:active { transform: translateY(1px); }

  /* 悬停设备上控件半透明 */
  @media (hover: hover) {
    .lang-toggle,
    .theme-toggle,
    .settings-toggle { opacity: .5; }

    .lang-toggle:hover,
    .lang-toggle:focus-visible,
    .theme-toggle:hover,
    .theme-toggle:focus-visible,
    .settings-toggle:hover,
    .settings-toggle:focus-visible { opacity: 1; }
  }

  /* 主题按钮图标 */
  .theme-toggle .icon {
    position: absolute;
    width: 21px;
    height: 21px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: opacity .3s ease, transform .45s cubic-bezier(.2, .8, .3, 1);
  }
  .icon-moon { opacity: 0; transform: rotate(-90deg) scale(.5); }
  body.dark .icon-sun  { opacity: 0; transform: rotate(90deg) scale(.5); }
  body.dark .icon-moon { opacity: 1; transform: none; }

  /* 设置按钮图标 */
  .settings-toggle .icon {
    width: 21px;
    height: 21px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform .45s cubic-bezier(.2, .8, .3, 1);
  }
  .settings-toggle:hover .icon {
    transform: rotate(45deg);
  }

  /* 主舞台 */
  .stage {
    width: min(600px, calc(100vw - 44px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  /* 搜索引擎按钮组 */
  .engines {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    min-height: 60px;
    width: 100%;
  }

  /* 单个搜索引擎按钮 */
  .engine {
    position: relative;
    width: 60px;
    height: 60px;
    padding: 0;
    border: 0;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background: var(--surface);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    box-shadow: none;
    opacity: .5;
    transition: background-color .35s ease, transform .15s ease,
                opacity .32s ease;
  }
  .engine:active { transform: translateY(1px); }

  /* 隐藏的引擎按钮 */
  .engine.is-hidden { display: none; }

  /* 搜索框聚焦时引擎高亮 */
  .stage:focus-within .engine { opacity: 1; }

  /* 鼠标悬停在单个引擎按钮上时高亮该按钮 */
  @media (hover: hover) {
    .engine:hover { opacity: 1; }
  }

  /* 引擎按钮的两种阴影层 */
  .engine::before,
  .engine::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    transition: opacity .40s cubic-bezier(.4, 0, .2, 1),
                box-shadow .35s ease;
  }
  .engine::before { box-shadow: var(--raise-1); opacity: 1; }
  .engine::after  { box-shadow: var(--press);   opacity: 0; }

  /* 引擎激活态阴影切换 */
  .engine.active::before { opacity: 0; }
  .engine.active::after  { opacity: 1; }

  /* 引擎图标 */
  .engine img {
    position: relative;
    z-index: 1;
    display: block;
    width: 35px;
    height: 35px;
    border-radius: 7px;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* 搜索框容器 */
  .search {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 7px 7px 4px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--raise-2);
    opacity: .5;
    transition: box-shadow .3s ease, background-color .35s ease,
                opacity .32s ease;
  }
  .search:focus-within {
    box-shadow: var(--raise-2-focus);
    opacity: 1;
  }
  .search:hover { opacity: 1; }

  /* 搜索输入框 */
  .search input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 15px 4px 15px 24px;
    border: 0;
    outline: 0;
    background: transparent;
    font: inherit;
    font-size: 16px;
    line-height: 1.4;
    color: var(--text);
    caret-color: currentColor;
    /* 禁用原生长按编辑菜单，避免与自定义菜单叠加 */
    -webkit-touch-callout: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .search input::placeholder { color: var(--placeholder); }

  /* 提交按钮 */
  .submit {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    box-shadow: var(--raise-1);
    transition: box-shadow .28s ease, color .28s ease,
                background-color .35s ease, transform .15s ease;
  }
  .submit:hover { color: var(--text); }
  .submit:active {
    transform: translateY(1px);
    box-shadow: var(--press);
  }

  /* 提交按钮图标 */
  .submit svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .search input:focus-visible { outline: none; }

  /* 右键菜单容器 */
  .context-menu {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 120;
    min-width: 208px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--raise-2);
    visibility: hidden;
    opacity: 0;
    transform: scale(.94);
    transform-origin: top left;
    transition: opacity .18s ease,
                transform .22s cubic-bezier(.3, .9, .3, 1),
                visibility .22s,
                background-color .35s ease,
                box-shadow .35s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .context-menu.open {
    visibility: visible;
    opacity: 1;
    transform: scale(1);
  }

  /* 菜单项 */
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: background-color .2s ease, box-shadow .25s ease,
                color .3s ease, opacity .25s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .menu-item:hover { background: rgba(128, 128, 128, .15); }
  .menu-item:active { box-shadow: var(--press); }
  .menu-item:disabled { opacity: .38; cursor: default; }
  .menu-item:disabled:hover { background: transparent; }
  .menu-item:disabled:active { box-shadow: none; }

  /* 菜单项图标 */
  .menu-item svg {
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .82;
  }

  /* 轻提示 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    z-index: 200;
    max-width: calc(100vw - 40px);
    padding: 11px 20px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    box-shadow: var(--raise-2);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 14px);
    transition: opacity .28s ease,
                transform .35s cubic-bezier(.3, .9, .3, 1),
                background-color .35s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* 设置遮罩层 */
  .settings-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0, 0, 0, 0);
    pointer-events: none;
    transition: background-color .35s ease;
  }
  .settings-overlay.open {
    background: rgba(0, 0, 0, .28);
    pointer-events: auto;
  }

  /* 设置侧边栏 */
  .settings-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 310;
    width: min(380px, 90vw);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    box-shadow: var(--raise-2);
    transform: translateX(102%);
    transition: transform .42s cubic-bezier(.25, .9, .28, 1),
                background-color .35s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .settings-panel.open { transform: translateX(0); }

  /* 侧边栏头部 */
  .settings-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 12px 20px;
    gap: 12px;
  }

  /* 侧边栏标题 */
  .settings-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  /* 侧边栏关闭按钮 */
  .settings-close {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    box-shadow: var(--raise-1);
    transition: color .25s ease, transform .15s ease,
                box-shadow .25s ease, background-color .35s ease;
  }
  .settings-close:hover { color: var(--text); }
  .settings-close:active {
    transform: translateY(1px);
    box-shadow: var(--press);
  }
  .settings-close svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 选项卡栏 */
  .settings-tabs {
    flex: 0 0 auto;
    position: relative;
    display: flex;
    margin: 4px 20px 0 20px;
    padding: 4px;
    border-radius: 999px;
    box-shadow: var(--track);
  }

  /* 选项卡滑动指示器 */
  .settings-tabs-thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--raise-1);
    transition: transform .34s cubic-bezier(.35, .9, .3, 1),
                background-color .35s ease, box-shadow .3s ease;
  }
  .settings-panel.tab-about .settings-tabs-thumb {
    transform: translateX(100%);
  }

  /* 选项卡按钮 */
  .settings-tab {
    position: relative;
    flex: 1;
    padding: 9px 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    z-index: 1;
    transition: color .25s ease;
  }
  .settings-tab.active { color: var(--text); }

  /* 选项卡内容区 */
  .settings-body {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 18px 20px 30px 20px;
    overscroll-behavior: contain;
  }

  /* 选项卡页 */
  .settings-page { display: none; }
  .settings-page.active { display: block; }

  /* 设置分组 */
  .settings-section {
    margin-bottom: 22px;
    padding: 16px 16px 18px 16px;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--raise-1);
  }

  /* 分组标题 */
  .settings-section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* 分组内的行 */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
  }
  .settings-row + .settings-row {
    border-top: 1px solid rgba(128, 128, 128, .18);
  }

  /* 行主文本 */
  .settings-row-label {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }

  /* 行次要说明 */
  .settings-row-desc {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.4;
  }

  /* 通用小按钮 */
  .settings-btn {
    flex: 0 0 auto;
    padding: 8px 14px;
    border: 0;
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--raise-1);
    transition: box-shadow .25s ease, color .25s ease,
                background-color .35s ease, transform .15s ease,
                opacity .25s ease;
  }
  .settings-btn:hover { color: var(--text); }
  .settings-btn:active {
    transform: translateY(1px);
    box-shadow: var(--press);
  }
  .settings-btn:disabled {
    opacity: .38;
    cursor: default;
    transform: none;
  }

  /* 图标列表 */
  .icon-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* 图标项 */
  .icon-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 8px 8px 10px;
    border-radius: 12px;
    transition: background-color .2s ease;
  }
  .icon-row:hover { background: rgba(128, 128, 128, .10); }

  /* 图标预览 */
  .icon-row img {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    -webkit-user-drag: none;
  }

  /* 图标名称 */
  .icon-row-name {
    flex: 1 1 auto;
    font-size: 14px;
    color: var(--text);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 开关按钮 */
  .switch {
    position: relative;
    flex: 0 0 auto;
    width: 44px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--track);
    cursor: pointer;
    transition: background-color .3s ease, box-shadow .3s ease,
                opacity .25s ease;
  }

  /* 开关滑块 */
  .switch-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: var(--raise-1);
    transition: transform .3s cubic-bezier(.35, .9, .3, 1),
                background-color .35s ease, box-shadow .3s ease;
  }

  /* 开关打开态 */
  .switch.on {
    background: var(--switch-on);
    box-shadow:
      inset 0 0 0 1px rgba(0, 0, 0, .06),
      0 2px 8px rgba(52, 199, 89, .35);
  }
  .switch.on .switch-thumb {
    transform: translateX(18px);
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  }

  /* 关于页容器 */
  .about-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px 12px 10px 12px;
    gap: 14px;
  }

  /* 关于标题 */
  .about-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1.35;
  }

  /* 关于图标 */
  .about-icon {
    width: 72px;
    height: 72px;
    margin: 2px 0;
    -webkit-user-drag: none;
  }

  /* 关于简介 */
  .about-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 260px;
  }

  /* 前往 GitHub 按钮 */
  .about-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    padding: 10px 20px;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    box-shadow: var(--raise-1);
    transition: box-shadow .28s ease, color .25s ease,
                background-color .35s ease, transform .15s ease;
  }
  .about-link:hover { color: var(--text); }
  .about-link:active {
    transform: translateY(1px);
    box-shadow: var(--press);
  }
  .about-link svg {
    width: 17px;
    height: 17px;
    fill: currentColor;
    flex: 0 0 auto;
  }

  /* 小屏适配 */
  @media (max-width: 520px) {
    .top-controls { top: 14px; right: 14px; gap: 10px; }
    .lang-toggle { width: 92px; height: 40px; }
    .lang-opt { font-size: 11px; }
    .theme-toggle,
    .settings-toggle { width: 42px; height: 42px; }
    .theme-toggle .icon,
    .settings-toggle .icon { width: 19px; height: 19px; }
    .stage { width: calc(100vw - 32px); gap: 22px; }
    .engines { gap: 10px; min-height: 42px; }
    .engine { width: 42px; height: 42px; border-radius: 13px; }
    .engine img { width: 22px; height: 22px; border-radius: 6px; }
    .search input { padding-left: 20px; font-size: 15px; }
    .submit { width: 42px; height: 42px; }
    .context-menu { min-width: 180px; }
    .menu-item { font-size: 13px; padding: 9px 10px; }
    .settings-panel { width: 100vw; }
    .settings-header { padding: 16px 16px 10px 16px; }
    .settings-tabs { margin: 4px 16px 0 16px; }
    .settings-body { padding: 16px 16px 26px 16px; }
  }
</style>

  function earlyContextMenu(e) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();

    if (e && typeof e.stopPropagation === 'function') e.stopPropagation();

  window.addEventListener('contextmenu', earlyContextMenu, true);

  // DOM0 属性兜底
  window.oncontextmenu = earlyContextMenu;
  document.oncontextmenu = earlyContextMenu;

  // 锁定属性防止被扩展覆盖
  try {
    Object.defineProperty(window, 'oncontextmenu', {
      configurable: false,
      get: function () { return earlyContextMenu; },
      set: function () {}

  // 读取系统语言
  function systemLang() {
    return String(navigator.language || navigator.userLanguage || 'en')
      .toLowerCase();
  }

  // 判断默认语言模式
  function detectDefaultMode() {
    return systemLang().indexOf('zh') === 0 ? 'zh' : 'en';
  }

  // 解析具体语言区域
  function resolveLocale(mode) {
    if (mode !== 'zh') return 'en';
    var l = systemLang();
    return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
  }

  // 获取当前文案

    return I18N[resolveLocale(langMode)];

  if (langMode !== 'zh' && langMode !== 'en') {
    langMode = detectDefaultMode();
    try { localStorage.setItem(LS_LANG, langMode); } catch (e) {}
  }

  var savedEngine = null;
  try { savedEngine = localStorage.getItem(LS_ENGINE); } catch (e) {}
  var current = (savedEngine && ENGINES.some(function (e) {
    return e.id === savedEngine;
  })) ? savedEngine : 'google';

    document.documentElement.lang = loc;

    input.placeholder = t.searchWith(engineById(current).name);
    input.setAttribute('aria-label', t.search);
    submitBtn.setAttribute('aria-label', t.search);
    enginesEl.setAttribute('aria-label', t.engines);
    langBtn.setAttribute('aria-label', t.langAria);
    themeBtn.setAttribute('aria-label',
      theme === 'dark' ? t.toLight : t.toDark);

    menuUpload.setAttribute('aria-label', t.menuUpload);

  // 按 id 查引擎
  function engineById(id) {
    for (var i = 0; i < ENGINES.length; i++) {
      if (ENGINES[i].id === id) return ENGINES[i];
    }
    return ENGINES[0];
  }

  // 按 id 查按钮
  function btnById(id) {
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].dataset.id === id) return buttons[i];

  // 生成引擎按钮

    var btn = document.createElement('button');

  // 切换当前引擎
  function setEngine(id) {
    current = id;
    try { localStorage.setItem(LS_ENGINE, id); } catch (e) {}

    buttons.forEach(function (btn) {
      var on = btn.dataset.id === id;

  // 轮换引擎
  function rotateEngine(step) {
    var idx = 0;
    for (var i = 0; i < ENGINES.length; i++) {
      if (ENGINES[i].id === current) { idx = i; break; }
    }
    var next = ENGINES[(idx + step + ENGINES.length) % ENGINES.length];
    setEngine(next.id);
  }

  // 引擎隐藏状态
  var hiddenEngines = {};

  // 加载隐藏引擎
  (function loadHidden() {
    var raw = null;
    try { raw = localStorage.getItem(LS_HIDDEN); } catch (e) {}
    if (!raw) return;
    try {
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return;
      arr.forEach(function (id) {
        if (ENGINES.some(function (en) { return en.id === id; })) {
          hiddenEngines[id] = true;
        }
      });
    } catch (e) {}
  })();

  // 保存隐藏状态
  function saveHidden() {
    try {
      localStorage.setItem(LS_HIDDEN, JSON.stringify(Object.keys(hiddenEngines)));
    } catch (e) {}
  }

  // 隐藏引擎数量
  function hiddenEngineCount() {
    var n = 0;
    for (var i = 0; i < ENGINES.length; i++) {
      if (hiddenEngines[ENGINES[i].id]) n++;
    }
    return n;
  }

  // 应用隐藏状态
  function applyHiddenState() {
    for (var i = 0; i < ENGINES.length; i++) {
      var btn = btnById(ENGINES[i].id);
      if (btn) btn.classList.toggle('is-hidden', !!hiddenEngines[ENGINES[i].id]);
    }
    refreshIconListTexts();

  // 刷新引擎菜单可用状态
  function updateEngineMenuState() {
    menuHide.disabled = !contextEngineId;
    menuShow.disabled = hiddenEngineCount() === 0;

    closeMenus();
    if (!contextEngineId) return;
    hiddenEngines[contextEngineId] = true;
    applyHiddenState();

  // 输入框键盘交互
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      rotateEngine(e.shiftKey ? -1 : 1);
      return;

    if (e.key === 'Escape') input.value = '';

  // 全局 Tab 键交互
  document.addEventListener('keydown', function (e) {

    // 设置面板打开时，TAB 键无反应
    if (settingsPanel.classList.contains('open')) {
      e.preventDefault();

    if (document.activeElement === input) return;
    e.preventDefault();
    rotateEngine(e.shiftKey ? -1 : 1);
    input.focus();

  // 生成当前搜索链接

  // IndexedDB 参数
  var DB_NAME  = 'paleasy-tab';
  var DB_VER   = 1;
  var DB_STORE = 'assets';
  var DB_KEY   = 'custom-background';

  // 打开数据库
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      if (!('indexedDB' in window)) {
        reject(new Error('indexeddb-unavailable'));
        return;
      }
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE);
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror   = function () { reject(req.error); };
    });
  }

  // 写入数据
  function idbSet(key, value) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(value, key);
        tx.oncomplete = function () { db.close(); resolve(); };
        tx.onerror    = function () { db.close(); reject(tx.error); };
        tx.onabort    = function () { db.close(); reject(tx.error); };
      });
    });
  }

  // 读取数据
  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readonly');
        var rq = tx.objectStore(DB_STORE).get(key);
        rq.onsuccess = function () { resolve(rq.result); };
        rq.onerror   = function () { reject(rq.error); };
        tx.oncomplete = function () { db.close(); };
      });
    });
  }

  // 删除数据
  function idbDel(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = function () { db.close(); resolve(); };
        tx.onerror    = function () { db.close(); reject(tx.error); };
      });
    });
  }

  // 背景状态
  var hasCustomBg = false;

  // 刷新背景相关按钮状态
  function updateMenuState() {
    menuReset.disabled = !hasCustomBg;
    btnResetBg.disabled = !hasCustomBg;
  }

  // 右键菜单状态
  var activeMenu = null;
  var lastOpenTime = 0;

  // 输入框选区快照
  var savedSel = { start: 0, end: 0 };

  // 打开菜单
  function openMenu(menuEl, x, y) {
    var now = Date.now();
    if (menuEl === activeMenu && now - lastOpenTime < 400) return;
    lastOpenTime = now;

    if (activeMenu && activeMenu !== menuEl) {
      activeMenu.classList.remove('open');
    }
    activeMenu = menuEl;
    menuEl.classList.add('open');

    var pad = 10;
    var w = menuEl.offsetWidth;
    var h = menuEl.offsetHeight;

    var left = Math.min(Math.max(pad, x),
                        Math.max(pad, window.innerWidth - w - pad));
    var top  = Math.min(Math.max(pad, y),
                        Math.max(pad, window.innerHeight - h - pad));

    menuEl.style.left = left + 'px';
    menuEl.style.top  = top  + 'px';
  }

  // 关闭菜单
  function closeMenus() {
    if (!activeMenu) return;
    activeMenu.classList.remove('open');
    activeMenu = null;
  }

  // 刷新编辑菜单可用状态
  function updateInputMenuState() {
    var hasSel = savedSel.end > savedSel.start;
    menuCut.disabled  = !hasSel;
    menuCopy.disabled = !hasSel;
    menuPaste.disabled = false;
  }

  // 恢复输入框选区
  function restoreCaret() {
    input.focus({ preventScroll: true });
    try { input.setSelectionRange(savedSel.start, savedSel.end); } catch (err) {}
  }

  // 复制或剪切
  function doCopy(cut) {
    if (savedSel.end <= savedSel.start) return;
    restoreCaret();

    var ok = false;
    try { ok = document.execCommand(cut ? 'cut' : 'copy'); } catch (err) { ok = false; }

    if (!ok) {
      var text = input.value.slice(savedSel.start, savedSel.end);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () {});
      }
      if (cut) input.setRangeText('', savedSel.start, savedSel.end, 'end');
    }

    if (cut) {
      savedSel.start = savedSel.end = input.selectionStart || 0;
    }
  }

  // 插入文本
  function insertText(text) {
    input.focus({ preventScroll: true });
    try { input.setSelectionRange(savedSel.start, savedSel.end); } catch (err) {}

    var ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (err) { ok = false; }

    if (!ok) input.setRangeText(text, savedSel.start, savedSel.end, 'end');

    savedSel.start = savedSel.end = input.selectionStart || 0;
  }

  // 降级粘贴
  function legacyPaste() {
    restoreCaret();
    try { document.execCommand('paste'); } catch (err) {}
    savedSel.start = savedSel.end = input.selectionStart || 0;
  }

  // 粘贴
  function doPaste() {
    restoreCaret();
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        if (text) insertText(text);
      }).catch(function () {
        legacyPaste();
      });
    } else {
      legacyPaste();
    }
  }

  menuCut.addEventListener('click', function () { closeMenus(); doCopy(true); });
  menuCopy.addEventListener('click', function () { closeMenus(); doCopy(false); });
  menuPaste.addEventListener('click', function () { closeMenus(); doPaste(); });

  // 按目标分派菜单
  function showContextMenuAt(x, y, target) {
    if (target && target.nodeType !== 1) target = target.parentElement;

    if (target && target.closest && target.closest('.top-controls, .submit')) {
      closeMenus();
      return;
    }

    if (target && target.closest && target.closest('.settings-panel, .settings-overlay')) {
      closeMenus();
      return;
    }

    if (target && target.closest && target.closest('.context-menu')) {
      return;
    }

    var engineBtn = target && target.closest ? target.closest('.engine') : null;
    if (engineBtn) {
      contextEngineId = engineBtn.dataset.id;
      updateEngineMenuState();
      openMenu(engineMenu, x, y);
      return;
    }

    var engineArea = target && target.closest ? target.closest('.engines') : null;
    if (engineArea) {
      contextEngineId = null;
      updateEngineMenuState();
      openMenu(engineMenu, x, y);
      return;
    }

    if (target === input) {
      savedSel.start = input.selectionStart || 0;
      savedSel.end   = input.selectionEnd   || 0;
      updateInputMenuState();
      openMenu(inputMenu, x, y);
      return;
    }

    updateMenuState();
    openMenu(ctxMenu, x, y);
  }

  // 暴露给早期监听
  window.__showContextMenuAt = showContextMenuAt;

  // 移动端长按参数
  var LONG_PRESS_MS = 500;
  var LONG_PRESS_TOLERANCE = 12;
  var touchInfo = null;

  // 取消长按
  function cancelLongPress() {
    if (!touchInfo) return;
    clearTimeout(touchInfo.timer);
    touchInfo = null;
  }

  // 移动端长按事件
  if (isTouchDevice) {
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { cancelLongPress(); return; }
      var t = e.touches[0];
      touchInfo = {
        x: t.clientX,
        y: t.clientY,
        target: e.target,
        fired: false,
        timer: setTimeout(function () {
          if (!touchInfo) return;
          touchInfo.fired = true;
          showContextMenuAt(touchInfo.x, touchInfo.y, touchInfo.target);
        }, LONG_PRESS_MS)
      };
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (!touchInfo) return;
      var t = e.touches[0];
      var dx = t.clientX - touchInfo.x;
      var dy = t.clientY - touchInfo.y;
      if (dx * dx + dy * dy >
          LONG_PRESS_TOLERANCE * LONG_PRESS_TOLERANCE) {
        cancelLongPress();
      }
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
      if (!touchInfo) return;
      var fired = touchInfo.fired;
      cancelLongPress();
      if (fired) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchcancel', cancelLongPress);

    document.addEventListener('touchstart', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('.context-menu')) {
        if (e.touches.length === 1) {
          cancelLongPress();
        }
      }
    }, { passive: true });
  }

  // 菜单关闭时机
  document.addEventListener('pointerdown', function (e) {
    if (!activeMenu) return;
    if (activeMenu.contains(e.target)) return;
    closeMenus();
  }, true);

  window.addEventListener('blur', closeMenus);
  window.addEventListener('resize', closeMenus);
  document.addEventListener('scroll', closeMenus, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenus();
  });

  updateMenuState();

  // 背景压缩参数
  var MAX_FILE_SIZE = 50 * 1024 * 1024;
  var MAX_EDGE      = 1920;
  var JPEG_QUALITY  = 0.86;

  // 应用自定义背景
  function applyBackground(dataURL) {
    hasCustomBg = true;
    body.style.backgroundImage    = 'url("' + dataURL + '")';
    body.style.backgroundSize     = 'cover';
    body.style.backgroundPosition = 'center center';
    body.style.backgroundRepeat   = 'no-repeat';
    body.style.backgroundAttachment = 'fixed';
    updateMenuState();
  }

  // 清除自定义背景
  function clearBackground() {
    hasCustomBg = false;
    body.style.backgroundImage    = '';
    body.style.backgroundSize     = '';
    body.style.backgroundPosition = '';
    body.style.backgroundRepeat   = '';
    body.style.backgroundAttachment = '';
    updateMenuState();
  }

  // 压缩图片
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();

      img.onload = function () {
        URL.revokeObjectURL(url);
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) { reject(new Error('bad-image')); return; }

          var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
          var tw = Math.max(1, Math.round(w * scale));
          var th = Math.max(1, Math.round(h * scale));

          var canvas = document.createElement('canvas');
          canvas.width  = tw;
          canvas.height = th;

          var ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          if ('imageSmoothingQuality' in ctx) {
            ctx.imageSmoothingQuality = 'high';
          }
          ctx.drawImage(img, 0, 0, tw, th);

          var type = /^image\/(png|webp)$/.test(file.type) ? file.type : 'image/jpeg';
          resolve(canvas.toDataURL(type, JPEG_QUALITY));
        } catch (err) {
          reject(err);
        }
      };

      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('decode-failed'));
      };

      img.src = url;
    });
  }

  // 从存储恢复背景
  function restoreBackground() {
    return idbGet(DB_KEY).then(function (dataURL) {
      if (typeof dataURL === 'string' && dataURL) applyBackground(dataURL);
      else updateMenuState();
    }).catch(function () {
      updateMenuState();
    });
  }

  // 加固调用
  try {
    var p = restoreBackground();
    if (p && typeof p.catch === 'function') {
      p.catch(function () { updateMenuState(); });
    }
  } catch (e) {
    updateMenuState();
  }

  menuUpload.addEventListener('click', function () {
    closeMenus();
    fileInput.click();
  });

  // 上传文件处理
  fileInput.addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;

    var t = currentTexts();

    if (!/^image\//.test(file.type)) {
      showToast(t.bgNotImage);
      return;
    }
    if (file.size > MAX_FILE_SIZE) {
      showToast(t.bgTooLarge);
      return;
    }

    compressImage(file).then(function (dataURL) {
      return idbSet(DB_KEY, dataURL).then(function () {
        applyBackground(dataURL);
      });
    }).catch(function () {
      showToast(currentTexts().bgFailed);
    });
  });

  menuReset.addEventListener('click', function () {
    closeMenus();
    if (!hasCustomBg) return;
    clearBackground();
    idbDel(DB_KEY).catch(function () {});
  });

  // 焦点记忆
  var lastFocused = null;

  // 打开设置面板
  function openSettings() {
    closeMenus();
    lastFocused = document.activeElement;
    settingsPanel.classList.add('open');
    settingsOverlay.classList.add('open');
    // 焦点移入面板
    try { settingsClose.focus({ preventScroll: true }); } catch (err) {}
  }

  // 关闭设置面板
  function closeSettings() {
    settingsPanel.classList.remove('open');
    settingsOverlay.classList.remove('open');
    // 焦点返回触发元素
    if (lastFocused && lastFocused !== document.body &&
        typeof lastFocused.focus === 'function') {
      try { lastFocused.focus({ preventScroll: true }); } catch (err) {}
    }
    lastFocused = null;
  }

  // 切换选项卡
  function switchSettingsTab(name) {
    var isAbout = name === 'about';
    settingsPanel.classList.toggle('tab-about', isAbout);
    tabButtons.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === name);
    });
    settingsPages.forEach(function (page) {
      page.classList.toggle('active', page.dataset.page === name);
    });
  }

  // 构建图标列表
  function buildIconList() {
    iconListEl.innerHTML = '';
    ENGINES.forEach(function (engine) {
      var row = document.createElement('div');
      row.className = 'icon-row';

      var img = document.createElement('img');
      img.src = engine.icon;
      img.alt = '';
      img.draggable = false;
      row.appendChild(img);

      var name = document.createElement('div');
      name.className = 'icon-row-name';
      name.textContent = engine.name;
      row.appendChild(name);

      var sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'switch';
      sw.dataset.id = engine.id;
      sw.setAttribute('role', 'switch');

      var thumb = document.createElement('span');
      thumb.className = 'switch-thumb';
      thumb.setAttribute('aria-hidden', 'true');
      sw.appendChild(thumb);

      sw.addEventListener('click', function () {
        var id = sw.dataset.id;
        if (hiddenEngines[id]) {
          delete hiddenEngines[id];
        } else {
          hiddenEngines[id] = true;
        }
        applyHiddenState();
        saveHidden();
      });

      row.appendChild(sw);
      iconListEl.appendChild(row);
    });
    refreshIconListTexts();
  }

  // 刷新图标列表文案与状态
  function refreshIconListTexts() {
    var t = currentTexts();
    var rows = iconListEl.querySelectorAll('.icon-row');
    for (var i = 0; i < rows.length; i++) {
      var sw = rows[i].querySelector('.switch');
      if (!sw) continue;
      var id = sw.dataset.id;
      var hidden = !!hiddenEngines[id];
      sw.classList.toggle('on', !hidden);
      sw.setAttribute('aria-checked', hidden ? 'false' : 'true');
      sw.setAttribute('aria-label', (engineById(id).name) + ' ' +
        (hidden ? t.iconHidden : t.iconShow));
    }
  }

  settingsToggle.addEventListener('click', function () {
    if (settingsPanel.classList.contains('open')) closeSettings();
    else openSettings();
    this.blur();
  });

  settingsClose.addEventListener('click', function () {
    closeSettings();
  });

  settingsOverlay.addEventListener('click', function () {
    closeSettings();
  });

  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      switchSettingsTab(btn.dataset.tab);
    });
  });

  btnUploadBg.addEventListener('click', function () {
    fileInput.click();
  });

  btnResetBg.addEventListener('click', function () {
    if (!hasCustomBg) return;
    clearBackground();
    idbDel(DB_KEY).catch(function () {});
  });

  // Esc 关闭设置面板
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && settingsPanel.classList.contains('open')) {
      closeSettings();
    }
  });

  // GitHub 按钮：中键在新标签打开
  aboutLink.addEventListener('auxclick', function (e) {
    if (e.button !== 1) return;
    e.preventDefault();
    window.open(aboutLink.href, '_blank', 'noopener,noreferrer');
  });

  // 阻止中键触发原生自动滚动
  aboutLink.addEventListener('mousedown', function (e) {
    if (e.button === 1) e.preventDefault();
  });

  buildIconList();

  // 加载后自动聚焦（仅桌面端，避免移动端弹出软键盘）
  window.addEventListener('load', function () {
    if (!isTouchDevice) {
      input.focus({ preventScroll: true });
    }
  });
})();
</script>
</body>
</html>
